[package]
name = "dubSuite"
version = "0.1.10"
edition = "2024"
description = "Lanceur des applications dub"
publish = false

[dependencies]
eframe = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = "2"

[build-dependencies]
winresource = "0.1"
